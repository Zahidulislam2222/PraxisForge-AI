services:
  db:
    image: ${PRAXIS_DB_IMAGE:?Set verified database image digest}
    pull_policy: never
    user: postgres
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set database bootstrap user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database bootstrap password}
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
      APP_DB_USER: ${APP_DB_USER:?Set application database user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set application database password}
    volumes:
      - database:/var/lib/postgresql
      - ./init-database.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=1777
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  model:
    image: ${PRAXIS_MODEL_IMAGE:?Set verified local model image digest}
    pull_policy: never
    restart: unless-stopped
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:?Set private model listener}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:?Set model concurrency}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:?Set model count}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:?Set idle unload policy}
      OLLAMA_NO_CLOUD: "1"
    volumes: ["models:/root/.ollama"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 6g
    cpus: 3
    networks: [private]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
  api:
    image: ${PRAXIS_CORE_IMAGE:?Set locally built core image}
    pull_policy: never
    env_file: application.env
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 512m
    cpus: 0.75
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"]
    networks: [edge,private]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "praxis.health"]
      interval: 20s
      timeout: 10s
      retries: 5
  worker:
    image: ${PRAXIS_CORE_IMAGE:?Set locally built core image}
    pull_policy: never
    env_file: worker.env
    command: ["python", "-m", "praxis.worker"]
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 0.75
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001"]
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
      model: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "praxis.worker_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  web:
    image: ${PRAXIS_IMAGE:?Set cached static edge image}
    pull_policy: never
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.35
    ports: ["127.0.0.1:${PRAXIS_PORT:?Set verified loopback port}:8080"]
    volumes:
      - "${PRAXIS_RELEASE_DIR:?Set immutable release directory}/site:/usr/share/nginx/html:ro"
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./headers.conf:/etc/nginx/headers.conf:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101"]
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
networks:
  edge:
    driver: bridge
    ipam:
      config: [{subnet: "${PRAXIS_SUBNET:?Set verified edge subnet}"}]
  private:
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: "${PRAXIS_PRIVATE_SUBNET:?Set verified private subnet}"}]
volumes:
  database:
  models:
