services:
  web:
    image: ${PRAXIS_IMAGE:?Set the verified locally available image digest}
    pull_policy: never
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.35
    ports:
      - "127.0.0.1:${PRAXIS_PORT:?Set the reserved loopback port}:8080"
    volumes:
      - "${PRAXIS_RELEASE_DIR:?Set the immutable release directory}/site:/usr/share/nginx/html:ro"
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./headers.conf:/etc/nginx/headers.conf:ro"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${PRAXIS_SUBNET:?Set a verified non-overlapping project subnet}
