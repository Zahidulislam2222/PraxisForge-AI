# Adapted from the existing global security template for this WSL workspace.
# All three scanners remain enabled; scanner errors must fail the hook.
repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (secrets in staged diff)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false

      - id: bandit
        name: bandit (Python SAST, medium+ severity)
        entry: .venv-security/bin/bandit -q -ll
        language: system
        types: [python]

      - id: semgrep-wsl
        name: semgrep p/security-audit (native WSL)
        entry: env SEMGREP_SETTINGS_FILE=memory/security/semgrep-settings.yml SEMGREP_LOG_FILE=memory/security/semgrep.log SEMGREP_ENABLE_VERSION_CHECK=0 semgrep scan --error --config p/security-audit --metrics=off
        language: system
        types: [text]
